name: mrs_dth_diary_v1
description: Updated Version  27.01.2021 || 04.10PM

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  ########################################### use 3rd Party Dependencies #################################
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  provider: ^6.1.2
  fluttertoast: ^9.0.0
  passcode_screen: ^2.0.0
  flutter_svg: ^2.0.10
  flutter_animation_progress_bar: ^2.3.1
  curved_navigation_bar: ^1.0.6
  intl: ^0.20.2
  rounded_loading_button: ^2.1.0
  bubble_tab_indicator: ^0.1.6
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  uuid: ^4.5.1
  page_transition: ^2.1.0
  get: ^4.6.6
  flutter_slidable: ^4.0.3
  pull_to_reveal: ^0.0.3-nullsafety.0
  pull_to_refresh: ^2.0.0
  flutter_switch: ^0.3.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  ########################################### use 3rd Party Dependencies #################################

  animated_icon_button: any
dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_keyboard_visibility: ^6.0.0
  rounded_loading_button:
    path: packages/rounded_loading_button
  passcode_screen:
    path: packages/passcode_screen

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: ShortBaby
      fonts:
        - asset: assets/fonts/ShortBaby.ttf

    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster.ttf

    - family: TamilKavi
      fonts:
        - asset: assets/fonts/Kavivanar-Regular.ttf

    - family: TamilMeera
      fonts:
        - asset: assets/fonts/MeeraInimai-Regular.ttf

    - family: TamilArima
      fonts:
        - asset: assets/fonts/ArimaMadurai-Black.ttf

    - family: TamilArima1
      fonts:
        - asset: assets/fonts/ArimaMadurai-Bold.ttf

    - family: TamilArima2
      fonts:
        - asset: assets/fonts/ArimaMadurai-ExtraBold.ttf

    - family: TamilArima3
      fonts:
        - asset: assets/fonts/ArimaMadurai-ExtraLight.ttf

    - family: TamilArima4
      fonts:
        - asset: assets/fonts/ArimaMadurai-Light.ttf

    - family: TamilArima5
      fonts:
        - asset: assets/fonts/ArimaMadurai-Medium.ttf

    - family: TamilArima6
      fonts:
        - asset: assets/fonts/ArimaMadurai-Regular.ttf

    - family: TamilArima7
      fonts:
        - asset: assets/fonts/ArimaMadurai-Thin.ttf

    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 400
